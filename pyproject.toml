[project]
name = "noteagent"
version = "0.2.0"
description = "Convert PDF and PowerPoint course material into Markdown, notebooks, and Notion pages"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.7,<7",
    "PyMuPDF>=1.24,<2",
    "python-pptx>=1.0,<2",
    "Pillow>=10,<13",
    "httpx>=0.27,<1",
    "nbformat>=5.10,<6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["assets/*.png", "assets/*.icns", "assets/*.ico", "assets/*.svg"]

[tool.setuptools.data-files]
prompts = ["prompts/*.md"]
