[project]
name = "noteagent"
version = "0.3.0"
description = "Convert PDF and PowerPoint course material into Markdown, notebooks, and Notion pages"
requires-python = ">=3.10"
dependencies = [
    "pywebview>=6.2,<6.3; sys_platform == 'darwin'",
    "PyMuPDF>=1.24,<2",
    "python-pptx>=1.0,<2",
    "Pillow>=10,<13",
    "httpx>=0.27,<1",
    "nbformat>=5.10,<6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["assets/*.png", "assets/*.icns", "assets/*.ico", "assets/*.svg", "web/*.html", "web/assets/*"]
"app.desktop" = ["*.js"]

[tool.setuptools.data-files]
prompts = ["prompts/*.md"]
